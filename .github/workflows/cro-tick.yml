# Runs the CRO optimiser every 3 hours.
#
# This lives here rather than in vercel.json because Vercel's Hobby plan allows
# exactly one cron run per day, and it does not degrade quietly: a sub-daily
# schedule in vercel.json fails the whole deployment with "Hobby accounts are
# limited to daily cron jobs". So vercel.json keeps its daily run, and the extra
# frequency comes from here, where it is free.
#
# The endpoint is the same one Vercel's cron calls and authorises the same way,
# so the two can coexist: whichever fires first does the work, and the interval
# check inside the handler stops the other from repeating it.
#
# SETUP (one step, and nothing runs until it is done):
#   GitHub → repo Settings → Secrets and variables → Actions → New repository
#   secret, named CRON_SECRET, set to the same value as CRON_SECRET in Vercel.
#
# Without it every run skips with a notice rather than failing, so an unset
# secret shows up as a run that did nothing rather than a red repository.
name: CRO tick

on:
  schedule:
    # 8 runs a day, matching the Clarity budget: 10 calls a day, one per run,
    # two left spare for manual force runs.
    - cron: "0 */3 * * *"
  workflow_dispatch:

# One at a time. A backed-up queue firing two ticks at once would have both
# claim a Clarity call for the same window.
concurrency:
  group: cro-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the optimiser
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET is not set, so there is nothing to call yet. See the setup note at the top of this workflow."
            exit 0
          fi

          # --fail-with-body so a 401 or 500 fails the step *and* prints what the
          # endpoint said, rather than a bare exit code with no explanation.
          curl --silent --show-error --fail-with-body --location \
            --max-time 120 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://www.footholdsystems.com/api/cro/tick"
